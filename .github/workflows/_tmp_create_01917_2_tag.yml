name: tmp-create-0.19.17-2-tag
on:
  push:
    branches: [release/0.19.17-2-tag]
permissions:
  contents: write
jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag on verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          target=b2e6218960d52c80c63dce3c62125dc6c943add9
          current=$(gh api repos/Medvedolog/luci-app-podkop-bot/git/ref/tags/0.19.17-2 --jq .object.sha 2>/dev/null || true)
          if [ -n "$current" ]; then
            test "$current" = "$target"
            echo "tag already exists at expected commit"
            exit 0
          fi
          gh api --method POST repos/Medvedolog/luci-app-podkop-bot/git/refs \
            -f ref='refs/tags/0.19.17-2' \
            -f sha="$target"
