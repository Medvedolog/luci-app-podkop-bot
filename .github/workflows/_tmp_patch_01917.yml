name: tmp-luci-0.19.17-security-sync

on:
  push:
    branches:
      - dev/0.19.17-security-hardening

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0
      - name: Sync standalone bot
        run: |
          curl -fsSL https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.17-security-hardening/podkop_bot.sh -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
      - name: Update LuCI version and security guards
        run: python3 .github/tmp_patch_01917.py
      - name: Validate
        run: |
          sh -n root/usr/lib/podkop_bot/podkop_bot
          sh tools/check-sources.sh
          test "$(cat version.txt)" = "0.19.17"
          grep -q 'PKG_VERSION:=0.19.17' Makefile
          grep -q 'LUCI_APP_VERSION="0.19.17"' root/usr/libexec/rpcd/podkop_bot
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Makefile version.txt README.md CHANGELOG.md tools/check-sources.sh root/usr/libexec/rpcd/podkop_bot root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256
          git commit -m "0.19.17: sync Telegram security hardening"
          git push origin HEAD:dev/0.19.17-security-hardening
