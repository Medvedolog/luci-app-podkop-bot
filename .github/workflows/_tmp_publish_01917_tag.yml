name: tmp-publish-0.19.17-tag
on:
  push:
    branches: [release/0.19.17-tag]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish 0.19.17 GitHub Release from verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          target=913aa97c371d94d837e1b12f123f874e863eb32a
          test "$(gh api repos/Medvedolog/luci-app-podkop-bot/git/ref/tags/0.19.17 --jq .object.sha)" = "$target"
          if gh release view 0.19.17 >/dev/null 2>&1; then
            echo "Release 0.19.17 already exists"
            exit 0
          fi
          rm -rf dist
          mkdir -p dist
          gh run download 34588425145 -n owfeed-packages -D dist
          find dist -type f -maxdepth 3 -print
          apk=$(find dist -type f -name 'luci-app-podkop-bot-0.19.17-r1.apk' -print -quit)
          ipk=$(find dist -type f -name 'luci-app-podkop-bot_0.19.17-r1_all.ipk' -print -quit)
          test -n "$apk" && test -n "$ipk"
          cat > release-notes.md <<'EOF'
          ## luci-app-podkop-bot 0.19.17

          - Исправлен флаппинг, из-за которого бот мог слишком охотно уходить с рабочего прокси на аварийные маршруты.
          - Расширена диагностика Outbound: проверка 12 сервисов и отдельная кнопка проверки Telegram API.
          - Загрузка и обновление bot-скрипта ужесточены: только основной администратор, личный чат и короткая upload-сессия.
          - Добавлены уровни подробности системного журнала в Telegram и LuCI; обычный режим заметно тише.

          Пакеты собраны и проверены CI на OpenWrt 25.12 (APKv3) и OpenWrt 24.10 (IPK).
          EOF
          gh release create 0.19.17 "$apk" "$ipk" \
            --verify-tag \
            --title 'Release 0.19.17' \
            --notes-file release-notes.md \
            --latest
