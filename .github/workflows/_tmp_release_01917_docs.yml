name: tmp-release-0.19.17-docs
on:
  push:
    branches: [dev/0.19.17-security-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0
      - name: Sync release docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('README.md'); s=p.read_text()
          s=s.replace('# 🤖 luci-app-podkop-bot\n', '# 🤖 luci-app-podkop-bot 0.19.17\n', 1)
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          s=s.replace('### Unreleased — native OpenWrt packages through owfeed', '### 0.19.17 — anti-flap, security, diagnostics and native OpenWrt packages', 1)
          needle='''### 0.19.17 — anti-flap, security, diagnostics and native OpenWrt packages\n\n'''
          add='''### 0.19.17 — anti-flap, security, diagnostics and native OpenWrt packages\n\n- **[0.19.17 / anti-flap]** Исправлен ложный уход POLL на аварийный Direct из-за слишком быстро устаревавшего follower-sample: freshness теперь соответствует реальному циклу follower, а существующий hysteresis сохраняет быстрый recovery без смешивания POLL и FAST.\n- **[0.19.17 / runtime]** Полный Outbound-тест показывает 12 внешних сервисов и работает в background worker; отдельная кнопка проверки Telegram Bot API сохранена в Runtime.\n- **[0.19.17 / logging]** В LuCI и Telegram доступны уровни журнала `Тихий / Обычный / Отладочный`; обычный режим убирает рутинную телеметрию и оставляет изменения состояния follower плюс редкую сводку.\n'''
          assert needle in s
          s=s.replace(needle, add, 1)
          p.write_text(s)
          PY
      - name: Validate release metadata
        run: |
          test "$(cat version.txt)" = "0.19.17"
          grep -Fq 'PKG_VERSION:=0.19.17' Makefile
          grep -Fq 'LUCI_APP_VERSION="0.19.17"' root/usr/libexec/rpcd/podkop_bot
          grep -Fq 'BOT_VERSION="0.19.17"' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq '# 🤖 luci-app-podkop-bot 0.19.17' README.md
          grep -Fq '### 0.19.17 — anti-flap' CHANGELOG.md
          sh tools/check-sources.sh
          sh -n root/usr/lib/podkop_bot/podkop_bot
          node --check root/www/luci-static/resources/view/podkop-bot/settings.js
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CHANGELOG.md
          git commit -m "docs: finalize 0.19.17 release notes"
          git push origin HEAD:dev/0.19.17-security-hardening
