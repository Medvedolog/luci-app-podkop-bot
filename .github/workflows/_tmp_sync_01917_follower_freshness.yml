name: tmp-sync-0.19.17-follower-freshness

on:
  push:
    branches:
      - dev/0.19.17-security-hardening

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0
      - name: Sync standalone bot
        run: |
          curl -fsSL https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.17-security-hardening/podkop_bot.sh -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
      - name: Validate
        run: |
          sh -n root/usr/lib/podkop_bot/podkop_bot
          grep -q '_max_age=$((_hi \* 5 \* 2 + 30))' root/usr/lib/podkop_bot/podkop_bot
          sh tools/check-sources.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256
          git commit -m "0.19.17: sync follower freshness cadence fix"
          git push origin HEAD:dev/0.19.17-security-hardening
