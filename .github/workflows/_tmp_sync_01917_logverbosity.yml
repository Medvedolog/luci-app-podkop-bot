name: tmp-sync-0.19.17-logverbosity
on:
  push:
    branches: [dev/0.19.17-security-hardening]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0
      - name: Sync bot and LuCI verbosity selector
        run: |
          curl -fsSL https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.17-security-hardening/podkop_bot.sh -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('root/www/luci-static/resources/view/podkop-bot/settings.js'); s=p.read_text()
          old="""\t\to = s.option(form.Value, 'health_interval', _('Интервал проверки, сек'),\n\t\t\t_('Период watchdog-проверки. Диапазон 30–3600. Меньше — быстрее реакция, больше нагрузка.'));\n\t\to.datatype = 'range(30,3600)';\n\t\to.default = '60';\n\n\t\to = s.option(form.Flag, 'broadcast_alerts', _('Рассылать алерты всем admin_ids'),"""
          new="""\t\to = s.option(form.Value, 'health_interval', _('Интервал проверки, сек'),\n\t\t\t_('Период watchdog-проверки. Диапазон 30–3600. Меньше — быстрее реакция, больше нагрузка.'));\n\t\to.datatype = 'range(30,3600)';\n\t\to.default = '60';\n\n\t\to = s.option(form.ListValue, 'log_level', _('Подробность системного журнала'),\n\t\t\t_('Тихий — только важные события; обычный — изменения состояния и редкие сводки; отладочный — подробные проверки и транспортная телеметрия. Изменение подхватывается ботом автоматически.'));\n\t\to.value('quiet', _('Тихий'));\n\t\to.value('normal', _('Обычный'));\n\t\to.value('debug', _('Отладочный'));\n\t\to.default = 'normal';\n\n\t\to = s.option(form.Flag, 'broadcast_alerts', _('Рассылать алерты всем admin_ids'),"""
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))

          c=Path('CHANGELOG.md'); cs=c.read_text()
          needle='## [Unreleased]\n'
          if needle in cs and 'selectable journal verbosity' not in cs:
              cs=cs.replace(needle, needle+'- 0.19.17: selectable journal verbosity (`quiet` / `normal` / `debug`) in Telegram and LuCI; normal mode collapses follower telemetry to state changes plus hourly summaries.\n',1)
              c.write_text(cs)

          q=Path('tools/check-sources.sh'); qs=q.read_text()
          marker='''if grep -E 'logger .*\\[Security\\].*(text=|\\$\\{text\\}|\\$text)' "$BOT_SRC" >/dev/null 2>&1; then\n    echo "security: attacker-controlled Telegram text must not reach syslog" >&2; exit 1;\nfi\n'''
          add=marker+'''\n# Journal verbosity contract (0.19.17+).\ngrep -Fq 'podkop_bot.settings.log_level="normal"' "$BOT_SRC" || {\n    echo "logging: normal default missing" >&2; exit 1;\n}\ngrep -Fq 'FOLLOWER_LOG_SUMMARY_TS_FILE' "$BOT_SRC" || {\n    echo "logging: follower summary/state gate missing" >&2; exit 1;\n}\ngrep -Fq "form.ListValue, 'log_level'" root/www/luci-static/resources/view/podkop-bot/settings.js || {\n    echo "logging: LuCI verbosity selector missing" >&2; exit 1;\n}\n'''
          assert qs.count(marker)==1, qs.count(marker)
          q.write_text(qs.replace(marker,add,1))
          PY
      - name: Validate
        run: |
          sh -n root/usr/lib/podkop_bot/podkop_bot
          node --check root/www/luci-static/resources/view/podkop-bot/settings.js
          sh tools/check-sources.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256 root/www/luci-static/resources/view/podkop-bot/settings.js tools/check-sources.sh CHANGELOG.md
          git commit -m "0.19.17: expose selectable journal verbosity"
          git push origin HEAD:dev/0.19.17-security-hardening
