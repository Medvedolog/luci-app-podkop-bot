name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: Sources parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh tools/check-sources.sh
      - run: sh tools/check-async-wrappers.sh

  build:
    name: Build native OpenWrt packages
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - uses: owfeed/owlab/setup@v0.6.5
        with:
          version: v0.6.5

      - name: Reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Stage LuCI package
        run: ./tools/stage.sh
      - run: owfeed plan
      - run: owfeed check
      - run: owfeed build
      - run: sh tools/check-package.sh

      - name: Prepare writable HWELP artifact directory
        run: |
          mkdir -p hwelp-proxy/dist
          chmod 0777 hwelp-proxy/dist

      - name: Build x86_64 hwelp-proxy for runtime smoke
        working-directory: hwelp-proxy
        run: owlab build

      - name: Build Cortex-A53 HWELP IPK for OpenWrt 24.10.5 filogic
        run: |
          sh tools/build-hwelp-sdk.sh \
            https://downloads.openwrt.org/releases/24.10.5/targets/mediatek/filogic/openwrt-sdk-24.10.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst \
            0fa98c542ee07f1423ebcdce19aed464bc7f8008ef2cbe83cb723ec694ed8c56 \
            aarch64_cortex-a53 dist

      - name: Build Cortex-A53 HWELP APK for OpenWrt 25.12.5 filogic
        run: |
          sh tools/build-hwelp-sdk.sh \
            https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst \
            ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25 \
            aarch64_cortex-a53 dist

      - name: Merge native artifacts into artifact contract
        run: |
          set -eu
          for d in hwelp-proxy/dist/*; do
            [ -d "$d" ] || continue
            arch=$(basename "$d")
            mkdir -p "dist/$arch"
            cp -a "$d"/. "dist/$arch/"
          done
          find dist -maxdepth 2 -type f -print | sort
          test -n "$(find dist/aarch64_cortex-a53 -maxdepth 1 -type f -name 'hwelp-proxy_*.ipk' -print -quit)"
          test -n "$(find dist/aarch64_cortex-a53 -maxdepth 1 -type f -name 'hwelp-proxy-*.apk' -print -quit)"
          test -n "$(find dist/x86_64 -maxdepth 1 -type f -name 'hwelp-proxy*' -print -quit)"

      - uses: actions/upload-artifact@v7
        with:
          name: owfeed-packages
          path: dist/
          if-no-files-found: error

  verify:
    name: Install on real OpenWrt userspace
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: owfeed-packages
          path: dist/

      - name: OpenWrt 25.12 APKv3
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "25.12.5"
          install: dist/noarch/luci-app-podkop-bot-*.apk
          assert: |
            package luci-app-podkop-bot
            file /usr/libexec/rpcd/podkop_bot
            file /usr/libexec/rpcd/podkop_bot_bearhole
            file /usr/lib/podkop_bot/install.sh
            file /usr/lib/podkop_bot/bearhole.sh
            file /etc/init.d/podkop-bearhole
            file /usr/lib/podkop_bot/vendor.sha256
            file /usr/share/luci/menu.d/luci-app-podkop-bot.json
            file /usr/share/rpcd/acl.d/luci-app-podkop-bot.json
            file /www/luci-static/resources/view/podkop-bot/overview.js
            file /www/luci-static/resources/view/podkop-bot/runtime-async.js
            file /www/luci-static/resources/view/podkop-bot/transport-ux.js
            file /www/luci-static/resources/view/podkop-bot/bearhole.js
            exec test ! -e /usr/bin/podkop-bearhole-proxy
            exec test ! -e /usr/bin/hwelp-proxy
            http 200 /cgi-bin/luci/admin/services/podkop-bot/overview
            http 200 /cgi-bin/luci/admin/services/podkop-bot/settings/wizard
            http 200 /cgi-bin/luci/admin/services/podkop-bot/transport/main
            http 200 /cgi-bin/luci/admin/services/podkop-bot/transport/bearhole
            http 200 /cgi-bin/luci/admin/services/podkop-bot/runtime/services
            http 200 /cgi-bin/luci/admin/services/podkop-bot/update

      - name: OpenWrt 24.10 IPK
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "24.10.8"
          install: dist/all/luci-app-podkop-bot_*.ipk
          assert: |
            package luci-app-podkop-bot
            file /usr/libexec/rpcd/podkop_bot
            file /usr/libexec/rpcd/podkop_bot_bearhole
            file /usr/lib/podkop_bot/install.sh
            file /usr/lib/podkop_bot/bearhole.sh
            file /etc/init.d/podkop-bearhole
            file /usr/lib/podkop_bot/vendor.sha256
            file /usr/share/luci/menu.d/luci-app-podkop-bot.json
            file /usr/share/rpcd/acl.d/luci-app-podkop-bot.json
            file /www/luci-static/resources/view/podkop-bot/overview.js
            file /www/luci-static/resources/view/podkop-bot/runtime-async.js
            file /www/luci-static/resources/view/podkop-bot/transport-ux.js
            file /www/luci-static/resources/view/podkop-bot/bearhole.js
            exec test ! -e /usr/bin/podkop-bearhole-proxy
            exec test ! -e /usr/bin/hwelp-proxy
            http 200 /cgi-bin/luci/admin/services/podkop-bot/overview
            http 200 /cgi-bin/luci/admin/services/podkop-bot/settings/wizard
            http 200 /cgi-bin/luci/admin/services/podkop-bot/transport/main
            http 200 /cgi-bin/luci/admin/services/podkop-bot/transport/bearhole
            http 200 /cgi-bin/luci/admin/services/podkop-bot/runtime/services
            http 200 /cgi-bin/luci/admin/services/podkop-bot/update

      - name: OpenWrt 24.10 native HWELP runtime smoke
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "24.10.8"
          install: |
            dist/all/luci-app-podkop-bot_*.ipk
            dist/x86_64/hwelp-proxy_*.ipk
          assert: |
            package luci-app-podkop-bot
            package hwelp-proxy
            exec /usr/bin/hwelp-proxy --check
            exec /usr/bin/hwelp-proxy --version | grep -q '^hwelp-proxy '
            exec /etc/init.d/rpcd restart; sleep 2
            exec ubus call podkop_bot_bearhole start '{}' | jq -e '.ok == true' >/dev/null
            exec i=0; while [ "$i" -lt 120 ]; do s="$(ubus call podkop_bot_bearhole status '{}' 2>/dev/null || true)"; printf '%s' "$s" | jq -e '.state == "ready" and .running == true and .hwelp_installed == true' >/dev/null 2>&1 && break; printf '%s' "$s" | jq -e '.state == "failed"' >/dev/null 2>&1 && { printf '%s\n' "$s"; exit 1; }; sleep 1; i=$((i+1)); done; [ "$i" -lt 120 ]
            exec curl -q -4 -fsS --proxy http://127.0.0.1:1066 --connect-timeout 5 --max-time 15 https://raw.githubusercontent.com/Medvedolog/luci-app-podkop-bot/main/version.txt >/dev/null
            exec ubus call podkop_bot_bearhole set_port '{"port":1067}' | jq -e '.ok == true' >/dev/null
            exec i=0; while [ "$i" -lt 120 ]; do s="$(ubus call podkop_bot_bearhole status '{}' 2>/dev/null || true)"; printf '%s' "$s" | jq -e '.state == "ready" and .running == true and .port == 1067' >/dev/null 2>&1 && break; sleep 1; i=$((i+1)); done; [ "$i" -lt 120 ]
            exec curl -q -4 -fsS --proxy http://127.0.0.1:1067 --connect-timeout 5 --max-time 15 https://raw.githubusercontent.com/Medvedolog/luci-app-podkop-bot/main/version.txt >/dev/null
            exec ubus call podkop_bot_bearhole set_enabled '{"enabled":false}' | jq -e '.ok == true' >/dev/null
            exec i=0; while [ "$i" -lt 20 ]; do [ ! -e /etc/profile.d/99-podkop-bearhole.sh ] && break; sleep 1; i=$((i+1)); done; [ "$i" -lt 20 ]

  release-preflight:
    name: Release signing preflight
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify committed public signing keys
        run: |
          set -eu
          test -s keys/podkop-bot-sign.pub.pem || { echo 'missing keys/podkop-bot-sign.pub.pem; run tools/setup-keys.sh once and commit the public keys'; exit 1; }
          test -s keys/podkop-bot-release.pub || { echo 'missing keys/podkop-bot-release.pub; run tools/setup-keys.sh once and commit the public keys'; exit 1; }

  release:
    name: Sign and publish
    needs: [build, verify, release-preflight]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: owfeed/owfeed/.github/workflows/package.yml@v0.5.1
    secrets:
      sign-key: ${{ secrets.PODKOP_BOT_SIGN_KEY }}
      usign-key: ${{ secrets.PODKOP_BOT_USIGN_KEY }}
    with:
      owfeed-version: v0.5.1
      verify-with: keys/podkop-bot-release.pub